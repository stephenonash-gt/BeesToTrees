      title: "Tickets",
      desc:  "Official Red Out Game tickets through Stanford Athletics. Check with the Bay Area alumni chapter for group purchasing options and GT fan section info before buying individually.",
      url:   "https://tickets.gostanford.com/tickets/69c42da8fdb95cb986d58fcb",
      label: "Buy Tickets",
      style: "outline",
    },
  ];

  // ── FOOTER ───────────────────────────────────────────────────────
  const FOOTER = {
    credit:     "Built by Bay Area GT Alumni",  // ← update if you like
    disclaimer: "Not an official GT or Stanford site",
  };

  /* ╔═══════════════════════════════════════════════════════════════╗
     ║                  END OF EDITABLE CONTENT                     ║
     ║            Do not edit anything below this line.             ║
     ╚═══════════════════════════════════════════════════════════════╝ */

  // ── RENDER HERO ──────────────────────────────────────────────────
  document.getElementById('hero-eyebrow').textContent = SITE.eyebrow;
  document.getElementById('hero-matchup').innerHTML =
    `<span class="gt">Georgia Tech</span><span class="hero-vs">at</span>Stanford`;
  document.getElementById('hero-details').innerHTML =
    `<strong>${SITE.gameDate}</strong> &nbsp;·&nbsp; ${SITE.gameTime} &nbsp;·&nbsp; ${SITE.gameLocation} &nbsp;·&nbsp; ${SITE.gameNetwork}`;

  // ── RENDER EVENTS ────────────────────────────────────────────────
  const timeline = document.getElementById('timeline');
  EVENTS.forEach(day => {
    const dayEl = document.createElement('div');
    dayEl.className = 'timeline-day';
    let html = `<p class="timeline-day-header">${day.day}</p>`;
    day.items.forEach(ev => {
      const gameClass = ev.isGame ? ' is-game' : '';
      const tagsHtml = ev.tags.length
        ? `<div class="event-tags">${ev.tags.map(t => `<span class="tag tag-${t.style}">${t.label}</span>`).join('')}</div>`
        : '';
      html += `
        <div class="timeline-event${gameClass}">
          <p class="event-time">${ev.time}</p>
          <p class="event-name">${ev.name}</p>
          <p class="event-desc">${ev.desc}</p>
          ${tagsHtml}
        </div>`;
    });
    dayEl.innerHTML = html;
    timeline.appendChild(dayEl);
  });

  // ── RENDER GUIDE ─────────────────────────────────────────────────
  const guideGrid = document.getElementById('guide-grid');
  GUIDE.forEach(card => {
    const itemsHtml = card.items.map(item => {
      const nameHtml = item.url
        ? `<a href="${item.url}" target="_blank" rel="noopener"><strong>${item.name}</strong></a>`
        : `<strong>${item.name}</strong>`;
      return `<li>${nameHtml}<span>${item.detail}</span></li>`;
    }).join('');
    const cardEl = document.createElement('div');
    cardEl.className = 'guide-card';
    cardEl.innerHTML = `
      <div class="guide-icon">${card.icon}</div>
      <p class="guide-card-title">${card.title}</p>
      <ul class="guide-list">${itemsHtml}</ul>`;
    guideGrid.appendChild(cardEl);
  });

  // ── RENDER CONNECT ───────────────────────────────────────────────
  const connectGrid = document.getElementById('connect-grid');
  CONNECT.forEach(card => {
    const btnClass = card.style === 'gold' ? 'btn-connect-gold' : 'btn-connect-outline';
    const cardEl = document.createElement('div');
    cardEl.className = 'connect-card';
    cardEl.innerHTML = `
      <p class="connect-card-title">${card.title}</p>
      <p class="connect-card-desc">${card.desc}</p>
      <a href="${card.url}" target="_blank" rel="noopener" class="btn-connect ${btnClass}">${card.label}</a>`;
    connectGrid.appendChild(cardEl);
  });

  // ── RENDER FOOTER ─────────────────────────────────────────────────
  document.getElementById('footer-game').textContent =
    `Georgia Tech at Stanford · ${SITE.gameDate} · ${SITE.gameLocation}`;
  document.getElementById('footer-credit').textContent =
    `${FOOTER.credit} · ${FOOTER.disclaimer}`;

  // ── COUNTDOWN ────────────────────────────────────────────────────
  const KICKOFF = new Date(SITE.kickoffISO);
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    const diff = KICKOFF - new Date();
    if (diff <= 0) {
      ['cd-days','cd-hours','cd-mins','cd-secs'].forEach(id => document.getElementById(id).textContent = '00');
      return;
    }
    document.getElementById('cd-days').textContent  = pad(Math.floor(diff / 864e5));
    document.getElementById('cd-hours').textContent = pad(Math.floor((diff % 864e5) / 36e5));
    document.getElementById('cd-mins').textContent  = pad(Math.floor((diff % 36e5) / 6e4));
    document.getElementById('cd-secs').textContent  = pad(Math.floor((diff % 6e4) / 1e3));
  }
  tick();
  setInterval(tick, 1000);
  </script>

</body>
</html>
